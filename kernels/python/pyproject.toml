[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coc-engine"
version = "0.1.0a2"
description = "COC protocol client, host adapters and bounded AI orchestration"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "rfc3339-validator>=0.1.4", "psutil>=6", "websocket-client==1.9.0"]

[project.optional-dependencies]
admin = ["django>=5.2,<6.1"]
test = ["pytest>=8,<10", "psutil>=6"]

[project.scripts]
coc-host = "coc.host:main"
coc-orchestrator = "coc.orchestration:main"
coc-mcp = "coc.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coc = ["*.json"]
